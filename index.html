      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
      body {

      /* Animated gradient background */
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      .animated-gradient {
        background: linear-gradient(-45deg, #0a0e27, #1e1b4b, #1e3a8a, #0f172a);
        background-size: 400% 400%;
        animation: gradient-shift 15s ease infinite;
      }
      /* Glassmorphism effect */
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glass-strong {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      /* Neon glow effects */
      .neon-cyan {
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.5), 0 0 40px rgba(6, 182, 212, 0.3);
      }
      .neon-purple {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 0 40px rgba(168, 85, 247, 0.3);
      }
      .neon-red {
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.5), 0 0 40px rgba(239, 68, 68, 0.3);
      }
      .neon-amber {
        box-shadow: 0 0 20px rgba(251, 146, 60, 0.5), 0 0 40px rgba(251, 146, 60, 0.3);
      }
      /* Floating particles */
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.6;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); }
        25% { transform: translateY(-20px) translateX(10px); }
        50% { transform: translateY(-40px) translateX(-10px); }
        75% { transform: translateY(-20px) translateX(5px); }
      }
      /* Scan line effect */
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      .scan-line {
        position: fixed;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.6), transparent);
        animation: scan 8s linear infinite;
        pointer-events: auto;
        z-index: 1;
        filter: blur(0px);
        transition: all 0.3s ease;
      }
      .scan-line:hover {
        height: 8px;
        filter: blur(4px);
        background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.9), rgba(168, 85, 247, 0.7), transparent);
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.8);
      }
      /* Grid background */
      .grid-bg {
        background-image: 
          linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: grid-move 20s linear infinite;
      }
      @keyframes grid-move {
        0% { background-position: 0 0; }
        100% { background-position: 50px 50px; }
      }
      /* Spotlight effect */
      .spotlight {
        position: fixed;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
        transition: all 0.1s ease;
      }
      /* Pulse rings */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      /* Glitch effect */
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
      }
      /* Fade in animation */
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out;
      }
      /* Slide up animation */
      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slide-up 0.5s ease-out;
      }
      /* Pulse slow animation */
      @keyframes pulse-slow {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      .animate-pulse-slow {
        animation: pulse-slow 3s ease-in-out infinite;
      }
      /* Neon green color */
      .text-neon-green {
        color: #10b981;
      }
      .bg-neon-green {
        background-color: #10b981;
      }
      .border-neon-green {

      }
      /* Neon pink color */
      .text-neon-pink {
        color: #ec4899;
      }
      .bg-neon-pink {
        background-color: #ec4899;
      }
      /* Screen reader only utility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
